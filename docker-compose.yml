services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env 파일에 POSTGRES_PASSWORD 를 설정하세요}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex:
    # 이 포크가 릴리스 태그(v*)마다 GitHub Container Registry 에 발행하는 이미지입니다
    # (.github/workflows/release.yml 의 docker 잡). 상류 autumn27/artex 는 Docker Hub 에서 내려갔습니다.
    image: ghcr.io/jiwoochris/artex-global:${ARTEX_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
      # 첫 실행 보호. 비워 두면 기동 로그에 무작위 설정 토큰이 찍히고, /setup 에서 그 값을
      # 입력해야 관리자 비밀번호를 만들 수 있습니다(docker compose logs artex 로 확인).
      # ARTEX_ADMIN_PASSWORD 를 주면 /setup 없이 그 값으로 바로 초기화합니다(8자 이상).
      ARTEX_SETUP_TOKEN: ${ARTEX_SETUP_TOKEN:-}
      ARTEX_ADMIN_PASSWORD: ${ARTEX_ADMIN_PASSWORD:-}
      # 브라우저 교차 출처 허용 목록(쉼표 구분). 내장 UI 는 동일 출처라 보통 비워 둡니다.
      ARTEX_CORS_ORIGINS: ${ARTEX_CORS_ORIGINS:-}
      # 서버 쪽 기본 출력 언어(ko·en·zh·es). 비우면 한국어입니다. 에이전트 출력·오류 메시지는 설정 화면의
      # "표시 언어"가 우선하고, 서버 콘솔 로그는 이 값만 따릅니다.
      ARTEX_LANG: ${ARTEX_LANG:-}
      # 실행 플레인 분리(Management ↔ 샌드박스 Agent) 정책. off(기본)=단일 프로세스(모든 도구가
      # 여기서 실행); auto=Agent 있으면 오프로드·없으면 로컬 폴백; require=위험 작업은 반드시 샌드박스
      # Agent 에서만(Agent 없으면 fail-closed); pinned=작업마다 지정한 Agent 에서만. 격리 보장은
      # require/pinned 에서만 성립합니다. 잘못된 값은 기동을 거부합니다(off 로 묵살하지 않음).
      # 분리 배포 시: 이 값을 require 로 두고, 별도 샌드박스에서 artex-agent 를 실행한 뒤
      # `artex issue-agent` 로 발급한 번들로 연결하세요(연결 정보 생성만 artex 가 하고, 샌드박스
      # 자체는 사용자가 컨테이너/VM/방화벽으로 격리합니다). 예시는 e2e/docker-compose.yml 참고.
      ARTEX_AGENT_OFFLOAD: ${ARTEX_AGENT_OFFLOAD:-off}
      # 리버스(Management→Agent) 대신 Agent→Management 접속을 받을 주소(예: 0.0.0.0:8790). 비우면 비활성.
      ARTEX_AGENT_LISTEN: ${ARTEX_AGENT_LISTEN:-}
    ports:
      # 기본값은 호스트의 127.0.0.1 에만 게시합니다. 다른 기기에서 직접 접속하려면 .env 에
      # ARTEX_BIND=0.0.0.0 을 두되, 그 전에 반드시 초기 설정(관리자 비밀번호)을 마치고
      # 가능하면 README 의 리버스 프록시(HTTPS) 구성을 쓰십시오.
      - "${ARTEX_BIND:-127.0.0.1}:8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # 데이터 디렉터리(jwt.key, SQLite 등 포함)를 프로젝트 루트의 data/ 에 바인드합니다.
      # 호스트에서 바로 확인·백업할 수 있고, 컨테이너를 다시 만들어도 사라지지 않습니다.
      - ./data:/app/data
      # 프로젝트 루트의 skills 를 컨테이너에 마운트합니다(이미지에 내장된 /app/skills 를 덮어씁니다).
      # skill 을 고치면 이미지를 다시 빌드할 필요 없이, 컨테이너가 호스트의 이 파일을 그대로 읽습니다.
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
